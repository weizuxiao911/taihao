<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>太昊 OS · management</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; margin: 0; background: #f8fafc; color: #0f172a; }
    header { background: #0f172a; color: #fff; padding: 16px 32px; display: flex; justify-content: space-between; align-items: center; }
    header h1 { margin: 0; font-size: 20px; font-weight: 700; }
    .status { font-size: 13px; }
    .status .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: #22c55e; margin-right: 6px; }
    main { padding: 32px; max-width: 1280px; margin: 0 auto; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .card { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 24px; }
    .card h2 { margin: 0 0 16px; font-size: 14px; color: #64748b; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .stat { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
    .stat:last-child { border-bottom: none; }
    .stat .label { color: #64748b; }
    .stat .value { font-weight: 600; color: #0f172a; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #f1f5f9; }
    th { color: #64748b; font-weight: 600; background: #f8fafc; }
    tr:last-child td { border-bottom: none; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .badge.active { background: #dcfce7; color: #15803d; }
    .badge.inactive { background: #fee2e2; color: #b91c1c; }
    .log-line { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px; padding: 6px 0; border-bottom: 1px solid #f1f5f9; }
    .log-line:last-child { border-bottom: none; }
    .log-line .time { color: #94a3b8; margin-right: 12px; }
    .log-line .level { font-weight: 700; margin-right: 10px; padding: 1px 6px; border-radius: 3px; }
    .level.info { background: #dbeafe; color: #1d4ed8; }
    .level.warn { background: #fef3c7; color: #b45309; }
    .level.error { background: #fee2e2; color: #b91c1c; }
    .log-line .service { color: #475569; font-weight: 600; margin-right: 10px; }
    button { background: #0f172a; color: #fff; border: none; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: 600; }
    button:hover { background: #334155; }
    button.secondary { background: #fff; color: #0f172a; border: 1px solid #cbd5e1; margin-left: 4px; }
    .actions { display: flex; gap: 4px; }
    .empty { color: #94a3b8; font-size: 13px; padding: 12px; text-align: center; }
  </style>
</head>
<body>
  <header>
    <h1>太昊 OS · management</h1>
    <div class="status"><span class="dot"></span>运行中</div>
  </header>
  <main>
    <div class="grid">
      <div class="card">
        <h2>系统信息</h2>
        <div id="system-info" class="empty">加载中...</div>
      </div>
      <div class="card">
        <h2>服务列表</h2>
        <table id="services-table">
          <thead><tr><th>名称</th><th>状态</th><th>描述</th><th>Uptime</th><th>操作</th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="card" style="grid-column: 1 / -1;">
        <h2>最近日志</h2>
        <div id="logs"></div>
      </div>
    </div>
  </main>
  <script>
    function fmtUptime(s) {
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      return h > 0 ? `${h}h ${m}m` : `${m}m`;
    }

    async function loadSystemInfo() {
      const r = await fetch('/api/system/info');
      const d = await r.json();
      document.getElementById('system-info').innerHTML = `
        <div class="stat"><span class="label">OS</span><span class="value">${d.os}</span></div>
        <div class="stat"><span class="label">版本</span><span class="value">${d.version}</span></div>
        <div class="stat"><span class="label">Node</span><span class="value">${d.node}</span></div>
        <div class="stat"><span class="label">Uptime</span><span class="value">${d.uptime_seconds}s</span></div>
        <div class="stat"><span class="label">Memory RSS</span><span class="value">${(d.memory.rss / 1024 / 1024).toFixed(2)} MB</span></div>
        <div class="stat"><span class="label">Heap Used</span><span class="value">${(d.memory.heapUsed / 1024 / 1024).toFixed(2)} MB</span></div>
      `;
    }

    async function loadServices() {
      const r = await fetch('/api/services');
      const d = await r.json();
      const tbody = document.querySelector('#services-table tbody');
      tbody.innerHTML = d.services.map(s => `
        <tr>
          <td><strong>${s.name}</strong></td>
          <td><span class="badge ${s.status}">${s.status}</span></td>
          <td>${s.description}</td>
          <td>${fmtUptime(s.uptime)}</td>
          <td><div class="actions"><button class="secondary">详情</button><button>重启</button></div></td>
        </tr>
      `).join('');
    }

    async function loadLogs() {
      const r = await fetch('/api/logs');
      const d = await r.json();
      document.getElementById('logs').innerHTML = d.logs.map(l => `
        <div class="log-line">
          <span class="time">${l.time}</span>
          <span class="level ${l.level}">${l.level.toUpperCase()}</span>
          <span class="service">${l.service}</span>
          ${l.message}
        </div>
      `).join('');
    }

    loadSystemInfo();
    loadServices();
    loadLogs();
  </script>
</body>
</html>
