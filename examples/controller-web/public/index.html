<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>太昊 OS · 岸基控制侧演示台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "PingFang SC", "Microsoft YaHei", sans-serif; background: #eef1f5; color: #222; font-weight: 600; }
  header { background: #16324f; color: #fff; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
  header h1 { font-size: 18px; }
  header .sub { font-size: 11px; opacity: .8; font-weight: 400; }
  .online { padding: 4px 12px; border-radius: 12px; font-size: 12px; }
  .online.up { background: #2e7d4f; }
  .online.down { background: #b3261e; }
  main { display: flex; gap: 16px; padding: 16px 24px; height: calc(100vh - 62px); }
  .col { background: #fff; border-radius: 10px; box-shadow: 0 1px 6px rgba(0,0,0,.08); padding: 14px; display: flex; flex-direction: column; gap: 10px; overflow: hidden; }
  .col-left { width: 340px; flex-shrink: 0; }
  .col-right { flex: 1; }
  h2 { font-size: 13px; color: #444; border-bottom: 1px solid #eee; padding-bottom: 6px; }
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: #f5f8fc; border: 1px solid #dbe4ee; border-radius: 8px; padding: 8px 10px; }
  .stat .k { font-size: 10px; color: #777; }
  .stat .v { font-size: 16px; color: #16324f; }
  form { display: flex; flex-direction: column; gap: 8px; }
  input, textarea, button { font-family: inherit; border-radius: 6px; border: 1px solid #c8d2de; padding: 8px 10px; font-size: 12px; }
  textarea { resize: vertical; min-height: 60px; }
  button { background: #16324f; color: #fff; cursor: pointer; border: none; font-weight: 600; }
  button:hover { background: #1f4268; }
  .msg { background: #fafafa; border: 1px solid #e5e5e5; border-radius: 8px; padding: 8px 10px; font-size: 12px; font-weight: 400; font-family: Menlo, monospace; white-space: pre-wrap; word-break: break-all; }
  .msg .t { color: #888; font-size: 10px; }
  .msg .in { color: #1b7837; }
  .msg .out { color: #0b5394; }
  #stream { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }
  .task-item { font-size: 11px; background: #f0f7ff; border: 1px solid #cfe0f3; border-radius: 6px; padding: 6px 8px; font-weight: 400; font-family: Menlo, monospace; }
</style>
</head>
<body>
<header>
  <div>
    <h1>太昊 OS · 岸基控制侧演示台</h1>
    <div class="sub">comm-center 双链路通信 · SSE 任务下发 + HTTP 上报</div>
  </div>
  <div>
    <span class="online down" id="onlineBadge">设备离线</span>
  </div>
</header>

<main>
  <div class="col col-left">
    <h2>设备状态</h2>
    <div class="stat-grid">
      <div class="stat"><div class="k">设备心跳</div><div class="v" id="stHeartbeat">0</div></div>
      <div class="stat"><div class="k">最后心跳</div><div class="v" id="stLast">-</div></div>
      <div class="stat"><div class="k">运行时长</div><div class="v" id="stUptime">0s</div></div>
      <div class="stat"><div class="k">已下发任务</div><div class="v" id="stDelivered">0</div></div>
    </div>
    <div class="stat" style="grid-column: 1 / -1;">
      <div class="k">设备状态上报 (周期回传)</div>
      <div class="v" id="stStatus" style="font-size:12px;">-</div>
    </div>

    <h2>下发任务</h2>
    <form id="taskForm">
      <input id="taskTopic" value="task" placeholder="主题 (topic)">
      <textarea id="taskPayload" placeholder='载荷 (payload JSON)&#10;例: {"id":1,"action":"survey","zone":"A"}'>{"id":1,"action":"survey","zone":"A"}</textarea>
      <button type="submit">下发到设备</button>
    </form>

    <h2>任务队列</h2>
    <div id="queue" style="overflow-y:auto; display:flex; flex-direction:column; gap:4px;"></div>
  </div>

  <div class="col col-right">
    <h2>设备上报 / 通信记录</h2>
    <div id="stream"></div>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const badge = $('onlineBadge');

function fmtTime(iso) {
  if (!iso) return '-';
  const d = new Date(iso);
  return d.toLocaleTimeString('zh-CN', { hour12: false }) + '.' + String(d.getMilliseconds()).padStart(3, '0');
}

function addMsg(kind, title, body, extra) {
  const el = document.createElement('div');
  el.className = 'msg';
  el.innerHTML = `<span class="t">${fmtTime(new Date().toISOString())}</span> <span class="${kind}">${title}</span>\n${body}`;
  const stream = $('stream');
  stream.appendChild(el);
  while (stream.children.length > 120) stream.removeChild(stream.firstChild);
  stream.scrollTop = stream.scrollHeight;
  if (extra) updateStats(extra);
}

function updateStats(s) {
  $('stHeartbeat').textContent = s.heartbeats;
  $('stLast').textContent = fmtTime(s.lastHeartbeatAt);
  $('stUptime').textContent = s.uptimeSecs + 's';
  $('stDelivered').textContent = s.delivered.length;
  if (s.lastStatus) {
    let st = s.lastStatus.payload;
    try { st = JSON.parse(st); } catch (e) {}
    const line = typeof st === 'object'
      ? `${fmtTime(s.lastStatus.at)} · 链路=${st.active_primary} · 远程失败=${st.remote_failures} · 设备时间=${new Date(st.ts).toLocaleTimeString('zh-CN', {hour12:false})}`
      : `${fmtTime(s.lastStatus.at)} · ${s.lastStatus.payload}`;
    $('stStatus').textContent = line;
  }
  const online = s.deviceOnline;
  badge.textContent = online ? '设备在线' : '设备离线';
  badge.className = 'online ' + (online ? 'up' : 'down');
}

function renderQueue(items) {
  $('queue').innerHTML = items.map((t, i) =>
    `<div class="task-item">#${i + 1} <b>${t.topic}</b> — ${t.payload}</div>`).join('') || '<div style="font-size:11px;color:#999">队列为空</div>';
}

$('taskForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const task = { topic: $('taskTopic').value || 'task', payload: $('taskPayload').value };
  const resp = await fetch('/api/task', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(task) });
  const out = await resp.json();
  if (out.ok) { addMsg('out', '任务已入队', `${task.topic}\n${task.payload}`); } else { alert(out.error); }
});

// SSE 实时推送
const es = new EventSource('/live');
es.onmessage = (e) => {
  const s = JSON.parse(e.data);
  updateStats(s);
  renderQueue(s.taskQueue);
  const last = s.reports[s.reports.length - 1];
  if (last && last.at > (window._lastReportAt || '')) {
    window._lastReportAt = last.at;
    addMsg('in', `设备上报 · ${last.topic}`, last.payload);
  }
  const dlast = s.delivered[s.delivered.length - 1];
  if (dlast && dlast.at > (window._lastDeliveredAt || '')) {
    window._lastDeliveredAt = dlast.at;
    addMsg('out', `任务已送达设备 · ${dlast.topic}`, dlast.payload);
  }
};

// 定时轮询兜底自动刷新（SSE 断线 / 设备失联恢复时状态卡也能自动更新）
setInterval(async () => {
  try {
    const resp = await fetch('/api/state');
    const s = await resp.json();
    updateStats(s);
    renderQueue(s.taskQueue);
  } catch (e) { /* 服务暂不可达 */ }
}, 5000);
</script>
</body>
</html>
