# genimage · QEMU virt SD 卡镜像(arm64)
# 产出:out/taihao-qemu.img
# 结构:FAT32 boot(256M,内含 Image + initramfs.cpio + dtbs/)+ ext4 root(用 buildroot 预生成的 rootfs.ext2)
#
# QEMU 启动方式(SD 卡方案,代替原 -kernel -initrd 直启):
#   qemu-system-aarch64 -M virt \
#     -drive file=taihao-qemu.img,if=sd,format=raw \
#     -append "... root=/dev/mmcblk0p2" \
#     ...
#   或继续用 -kernel -initrd 直启(Image/initrd 同时塞在 FAT32 里,QEMU 不读,留着给 RPi 复用)

image boot.vfat {
    vfat {
        # 32-bit FAT(mkfs.vfat -F 32)
        extraargs = "-F 32"
    }

    # mountpoint 用以告知 genimage 从 --rootpath/<mountpoint>/ 取文件
    mountpoint = "/boot"

    # 256 MiB(够 Image 45M + initramfs 65M + dtbs ~30M + 富余)
    size = 256M
}

image rootfs.ext4 {
    ext4 {
        # 显式 size(genimage ext4 不自动算)
        # 1 GiB 起步,buildroot rootfs.ext2 是 1G
    }

    size = 1G

    # mountpoint /;genimage 会从 --rootpath/ 复制整个目录树到此镜像
    mountpoint = "/"
}

image sdcard.img {
    hdimage {
    }

    partition boot {
        partition-type = 0x0C    # FAT32 LBA
        bootable = "true"
        image = "boot.vfat"
    }

    partition rootfs {
        partition-type = 0x83    # Linux native
        image = "rootfs.ext4"
    }
}
