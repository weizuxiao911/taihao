# genimage · 树莓派 4B SD 卡镜像(arm64)
# 产出:out/taihao-rpi4b.img
# 结构:FAT32 boot(256M)+ ext4 root(1G,buildroot rootfs.ext2)
#
# 启动链:VideoCore(bootcode.bin)→ start_x.elf(arm_64bit=1)→ kernel8.img + bcm2711-rpi-4-b.dtb → root
#
# 烧 SD 卡:scripts/run/img烧到SD卡.sh rpi4b /dev/diskN
#
# QEMU 暂不支持此镜像(qemu-system-aarch64 不识别 VideoCore 启动链),
# 真机验证才有效

image boot.vfat {
    vfat {
        extraargs = "-F 32"
    }

    # mountpoint /boot;genimage 从 --inputpath/boot/ 取文件
    mountpoint = "/boot"

    # 256 MiB(bootcode + start_x.elf + fixup_x.dat + Image 45M + DTB + 富余)
    size = 512M
}

image rootfs.ext4 {
    ext4 {
    }

    size = 1G

    mountpoint = "/"
}

image sdcard.img {
    hdimage {
    }

    partition boot {
        partition-type = 0x0C    # FAT32 LBA(RPi 固件需要 0x06/0x0B/0x0C/0x0E,FAT32 用 0x0C)
        bootable = "true"
        image = "boot.vfat"
        # 1 MiB offset(RPi 固件在某些版本上要求 boot 分区对齐到 1MB 边界,
        # 否则 "Failed to open partition"。从 sector 1 改到 sector 2048。)
        offset = 4M
    }

    partition rootfs {
        partition-type = 0x83    # Linux native
        image = "rootfs.ext4"
    }
}
