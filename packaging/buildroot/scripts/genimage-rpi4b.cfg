# genimage · 树莓派 4B SD 卡镜像(arm64)
# 产出:out/taihao-rpi4b.img
# 结构:FAT32 boot(256M)+ ext4 root(1G,buildroot rootfs.ext2)
#
# 启动链:VideoCore(bootcode.bin)→ start_x.elf(arm_64bit=1)→ kernel8.img + bcm2711-rpi-4-b.dtb → root
#
# 烧 SD 卡:scripts/run/img烧到SD卡.sh rpi4b /dev/diskN
#
# QEMU 暂不支持此镜像(qemu-system-aarch64 不识别 VideoCore 启动链),
# 真机验证才有效
#
# 注意:rootfs 分区直接嵌入 buildroot 产出的 rootfs.ext2(完整 fakeroot 产物),
# 不要再让 genimage 重新打包(genimage 从空 staging 打包会生成空 rootfs,
# 且会覆盖 buildroot 的 rootfs.ext4 符号链接、污染 rootfs.ext2 本体)。

# 注:boot.vfat 由 post-image.sh 用 mkfs.vfat 显式生成(-h 16384 隐藏扇区,
# 与 8MiB 分区偏移一致;genimage 自己生成的 vfat 隐藏扇区值不对,固件读取会错位)。
# genimage 这里只负责把 boot.vfat 嵌入 hdimage。
image sdcard.img {
    hdimage {
    }

    partition boot {
        partition-type = 0x0C    # FAT32 LBA(RPi 固件需要 0x06/0x0B/0x0C/0x0E,FAT32 用 0x0C)
        bootable = "true"
        image = "boot.vfat"
        # 8 MiB offset,与官方 RPi OS 一致(官方 img boot 分区从 16384 扇区起)
        offset = 8M
    }

    partition rootfs {
        partition-type = 0x83    # Linux native
        image = "rootfs.ext2"
    }
}
