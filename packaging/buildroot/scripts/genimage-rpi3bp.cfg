# genimage · 树莓派 3B+ SD 卡镜像(arm64,arm_64bit=1 切换)
# 产出:out/taihao-rpi3bp.img
# 结构:FAT32 boot(256M)+ ext4 root(1G)
#
# 启动链:VideoCore → start_x.elf(arm_64bit=1)→ kernel8.img + bcm2710-rpi-3-b-plus.dtb → root
#
# 与 RPi 4B 区别:DTB 换成 bcm2710-rpi-3-b-plus.dtb(config.txt 的 device_tree=)
# 其他(bootcode.bin / start_x.elf / fixup_x.dat / config.txt 结构)完全相同

image boot.vfat {
    vfat {
        # 与官方 RPi OS 一致:FAT32 + 16KB 簇(固件读取需要)
        extraargs = "-F 32 -s 32"
    }

    mountpoint = "/boot"

    size = 512M
}

image sdcard.img {
    hdimage {
    }

    partition boot {
        partition-type = 0x0C    # FAT32 LBA
        bootable = "true"
        image = "boot.vfat"
        # 8 MiB offset,与官方 RPi OS 一致
        offset = 8M
    }

    partition rootfs {
        partition-type = 0x83
        # 直接嵌入 buildroot 产出的 rootfs.ext2(完整 fakeroot 产物),
        # 不要再让 genimage 重新打包(会生成空 rootfs 并污染 rootfs.ext2)
        image = "rootfs.ext2"
    }
}
