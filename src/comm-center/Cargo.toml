[package]
name = "comm-center"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "comm-center"
path = "src/main.rs"

[dependencies]
taihao-common = { path = "../taihao-common" }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
anyhow.workspace = true
chrono.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
async-trait = "0.1"
tokio-tungstenite = "0.24"
futures-util = "0.3"
rumqttc = "0.24"

[lints.rust]
unsafe_code = "forbid"