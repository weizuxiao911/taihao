[package]
name = "hal-gateway"
version = "0.1.0"
edition = "2021"
description = "太昊 OS HAL 网关 — 硬件调用的唯一入口 (白名单校验 + 审计日志)"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = "s"
lto = true
strip = true
