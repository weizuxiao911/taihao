[package]
name = "rt-loop"
version = "0.1.0"
edition = "2021"
description = "太昊 OS 高频实时回路 — C/Rust 10~100Hz 运动控制骨架 (消费 Pi Agent 决策)"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
clap = { version = "4", features = ["derive"] }
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = "s"
lto = true
strip = true
