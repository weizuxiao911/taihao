[package]
name = "pi-agent"
version = "0.1.0"
edition = "2021"
description = "太昊 OS Pi Agent — 唯一智能决策层"
license = "Apache-2.0"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
toml = "0.8"
ureq = { version = "2", features = ["json"] }
log = "0.4"
env_logger = "0.11"
clap = { version = "4", features = ["derive"] }
libc = "0.2"

[profile.release]
opt-level = "s"
lto = true
strip = true
