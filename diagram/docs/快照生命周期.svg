<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 700">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
    .title { font-size: 26px; font-weight: 800; letter-spacing: 2px; fill: #0f172a; }
    .node-title { font-size: 17px; font-weight: 800; text-anchor: middle; fill: #0f172a; }
    .node-sub { font-size: 12px; font-weight: 400; text-anchor: middle; fill: #475569; }
    .edge-label { font-size: 12px; font-weight: 600; text-anchor: middle; }
  </style>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <text x="240" y="60" class="title">QEMU 快照生命周期</text>
  <text x="240" y="86" font-size="14" fill="#64748b">契约 §4.3 · savevm / loadvm · 实测 load 0s · 失效自动重建</text>

  <!-- 行1: 冷启动 / 快照有效 (节点 400×80, y=150) -->
  <rect x="320" y="150" width="400" height="80" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="520" y="184" class="node-title">冷启动</text>
  <text x="520" y="208" class="node-sub">首次 boot · 无快照</text>

  <rect x="920" y="150" width="400" height="80" rx="8" fill="#ccfbf1" stroke="#14b8a6" stroke-width="2"/>
  <text x="1120" y="184" class="node-title">快照有效</text>
  <text x="1120" y="208" class="node-sub">boot-snap 已保存 · hash 匹配</text>

  <!-- 线1: 冷启动(右缘720,190) -> 快照有效(左缘920,190) -->
  <line x1="720" y1="190" x2="912" y2="190" stroke="#6366f1" stroke-width="2"/>
  <polyline points="912,182 918,190 912,198" fill="none" stroke="#6366f1" stroke-width="2"/>
  <text x="820" y="178" class="edge-label" fill="#6366f1">首次启动后 savevm</text>

  <!-- 行2: loadvm重启 / 快照失效 (节点 400×80, y=470) -->
  <rect x="320" y="470" width="400" height="80" rx="8" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
  <text x="520" y="504" class="node-title">loadvm 重启</text>
  <text x="520" y="528" class="node-sub">&lt; 2s 达成 basic.target</text>

  <rect x="920" y="470" width="400" height="80" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="1120" y="504" class="node-title">快照失效</text>
  <text x="1120" y="528" class="node-sub">Image 替换 → hash 变化</text>

  <!-- 线2: 快照有效(底1000,230) -> loadvm(顶520,470) 左绕: x=1000 与线3 x=1120 错开 -->
  <path d="M 1000 230 L 1000 360 L 520 360 L 520 462" fill="none" stroke="#6366f1" stroke-width="2"/>
  <polyline points="512,462 520,468 528,462" fill="none" stroke="#6366f1" stroke-width="2"/>
  <text x="760" y="352" class="edge-label" fill="#6366f1">再次启动 loadvm</text>

  <!-- 线3: 快照有效(底1120,230) -> 快照失效(顶1120,470) 垂直 -->
  <path d="M 1120 230 L 1120 462" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <polyline points="1112,462 1120,468 1128,462" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="1140" y="360" class="edge-label" fill="#f59e0b">Image / initramfs 替换</text>

  <!-- 线4: loadvm(左缘320,510) -> 冷启动(左缘320,190) 回退, [ 形折线 -->
  <path d="M 320 510 L 260 510 L 260 190 L 312 190" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <polyline points="312,182 318,190 312,198" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <text x="250" y="360" class="edge-label" fill="#94a3b8">验证失败 → loadvm 回退</text>

  <!-- 线5: 快照失效(右缘1320,510) -> 冷启动(顶520,150) 右绕+顶部走廊 -->
  <path d="M 1320 510 L 1380 510 L 1380 100 L 520 100 L 520 142" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <polyline points="512,142 520,148 528,142" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <text x="950" y="92" class="edge-label" fill="#94a3b8">重新冷启动 + 重建快照</text>
</svg>
