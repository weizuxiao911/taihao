<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
  </style>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- 参与者:统一宽 160 高 40 -->
  <rect x="40" y="80" width="160" height="40" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="120" y="105" fill="white" font-size="10.5" font-weight="600" text-anchor="middle">CI runner</text>

  <rect x="270" y="80" width="160" height="40" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
  <text x="350" y="105" fill="white" font-size="10.5" font-weight="600" text-anchor="middle">qemu-aarch64</text>

  <rect x="500" y="80" width="160" height="40" rx="6" fill="rgba(6,78,59,0.5)" stroke="#34d399" stroke-width="1.5"/>
  <text x="580" y="105" fill="white" font-size="10.5" font-weight="600" text-anchor="middle">kernel</text>

  <rect x="730" y="80" width="160" height="40" rx="6" fill="rgba(6,78,59,0.5)" stroke="#34d399" stroke-width="1.5"/>
  <text x="810" y="105" fill="white" font-size="10.5" font-weight="600" text-anchor="middle">systemd</text>

  <!-- 生命周期线 -->
  <line x1="120" y1="120" x2="120" y2="560" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="350" y1="120" x2="350" y2="560" stroke="#22d3ee" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="580" y1="120" x2="580" y2="560" stroke="#34d399" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <line x1="810" y1="120" x2="810" y2="560" stroke="#34d399" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- 消息1: CI->>Q 启动 -snapshot boot-snap -->
  <path d="M 120 160 L 348 160" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="234" y="153" fill="#cbd5e1" font-size="8.5" text-anchor="middle">启动 -snapshot boot-snap</text>

  <!-- 消息2: Q->>K boot -->
  <path d="M 350 196 L 578 196" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="464" y="189" fill="#cbd5e1" font-size="8.5" text-anchor="middle">boot</text>

  <!-- 消息3: K->>S 启动 pid 1 -->
  <path d="M 580 252 L 808 252" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="694" y="245" fill="#cbd5e1" font-size="8.5" text-anchor="middle">启动 pid 1</text>

  <!-- 消息4: S->>S 加载 unit(自消息环) -->
  <path d="M 810 308 L 838 308 L 838 336 L 816 336" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="848" y="304" fill="#94a3b8" font-size="8.5" text-anchor="start">加载 unit</text>

  <!-- 消息5: S->>S mount tmpfs/sysfs/proc/devtmpfs(自消息环) -->
  <path d="M 810 364 L 838 364 L 838 392 L 816 392" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="848" y="360" fill="#94a3b8" font-size="8.5" text-anchor="start">mount tmpfs/sysfs/proc/devtmpfs</text>

  <!-- 消息6: S->>S 拉起 basic.target(自消息环) -->
  <path d="M 810 420 L 838 420 L 838 448 L 816 448" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="848" y="416" fill="#94a3b8" font-size="8.5" text-anchor="start">拉起 basic.target</text>

  <!-- 消息7: S-->>Q basic.target active(虚线返回) -->
  <path d="M 810 476 L 352 476" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-green)"/>
  <text x="580" y="469" fill="#34d399" font-size="8.5" text-anchor="middle">basic.target active</text>

  <!-- 消息8: Q-->>CI exit 0(虚线返回) -->
  <path d="M 350 532 L 122 532" fill="none" stroke="#34d399" stroke-width="1.5" stroke-dasharray="6,4" marker-end="url(#arrow-green)"/>
  <text x="237" y="525" fill="#34d399" font-size="8.5" text-anchor="middle">exit 0</text>

  <!-- CI 通过判定 -->
  <rect x="860" y="476" width="100" height="36" rx="6" fill="rgba(6,78,59,0.5)" stroke="#34d399" stroke-width="1.2"/>
  <text x="910" y="499" fill="#34d399" font-size="9.5" font-weight="600" text-anchor="middle">CI 通过</text>

  <text x="40" y="36" fill="white" font-size="16" font-weight="700">CI 冒烟时序</text>
  <text x="40" y="54" fill="#94a3b8" font-size="10">契约 §7.1 · 启动到 basic.target ≤ 30s · 冒烟 ≤ 10s · 实测 7s</text>
</svg>
