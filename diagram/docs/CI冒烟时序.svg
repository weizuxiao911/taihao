<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 590">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
    .title { font-size: 16px; font-weight: 800; letter-spacing: 2px; fill: #0f172a; }
    .node-title { font-size: 11px; font-weight: 800; text-anchor: middle; fill: #0f172a; }
    .node-sub { font-size: 9px; font-weight: 400; text-anchor: middle; fill: #475569; }
    .msg { font-size: 8.5px; font-weight: 500; fill: #475569; }
    .msg-green { font-size: 8.5px; font-weight: 700; fill: #059669; }
  </style>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- 参与者:统一宽 160 高 40,浅色 + 彩色描边 -->
  <rect x="40" y="80" width="160" height="40" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="120" y="105" class="node-title">CI runner</text>

  <rect x="270" y="80" width="160" height="40" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
  <text x="350" y="105" class="node-title">qemu-aarch64</text>

  <rect x="500" y="80" width="160" height="40" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="580" y="105" class="node-title">kernel</text>

  <rect x="730" y="80" width="160" height="40" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="810" y="105" class="node-title">systemd</text>

  <!-- 生命周期线 -->
  <line x1="120" y1="120" x2="120" y2="560" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="4,3"/>
  <line x1="350" y1="120" x2="350" y2="560" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="4,3"/>
  <line x1="580" y1="120" x2="580" y2="560" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="4,3"/>
  <line x1="810" y1="120" x2="810" y2="560" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="4,3"/>

  <!-- 消息1: CI->>Q 启动 -snapshot boot-snap -->
  <line x1="120" y1="160" x2="344" y2="160" stroke="#94a3b8" stroke-width="1.5"/>
  <polyline points="338,154 346,160 338,166" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="234" y="152" class="msg" text-anchor="middle">启动 -snapshot boot-snap</text>

  <!-- 消息2: Q->>K boot -->
  <line x1="350" y1="196" x2="574" y2="196" stroke="#94a3b8" stroke-width="1.5"/>
  <polyline points="568,190 576,196 568,202" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="464" y="188" class="msg" text-anchor="middle">boot</text>

  <!-- 消息3: K->>S 启动 pid 1 -->
  <line x1="580" y1="252" x2="804" y2="252" stroke="#94a3b8" stroke-width="1.5"/>
  <polyline points="798,246 806,252 798,258" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="694" y="244" class="msg" text-anchor="middle">启动 pid 1</text>

  <!-- 消息4: S->>S 加载 unit(自消息环) -->
  <path d="M 810 308 L 838 308 L 838 336 L 816 336" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <polyline points="828,340 820,336 828,332" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="844" y="326" class="msg" text-anchor="start">加载 unit</text>

  <!-- 消息5: S->>S mount tmpfs/sysfs/proc/devtmpfs(自消息环) -->
  <path d="M 810 364 L 838 364 L 838 392 L 816 392" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <polyline points="828,396 820,392 828,388" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="844" y="382" class="msg" text-anchor="start">mount tmpfs/sysfs/proc/devtmpfs</text>

  <!-- 消息6: S->>S 拉起 basic.target(自消息环) -->
  <path d="M 810 420 L 838 420 L 838 448 L 816 448" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <polyline points="828,452 820,448 828,444" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="844" y="438" class="msg" text-anchor="start">拉起 basic.target</text>

  <!-- 消息7: S-->>Q basic.target active(虚线返回) -->
  <line x1="810" y1="476" x2="354" y2="476" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6,4"/>
  <polyline points="360,470 352,476 360,482" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <text x="580" y="468" class="msg-green" text-anchor="middle">basic.target active</text>

  <!-- 消息8: Q-->>CI exit 0(虚线返回) -->
  <line x1="350" y1="532" x2="124" y2="532" stroke="#10b981" stroke-width="1.5" stroke-dasharray="6,4"/>
  <polyline points="130,526 122,532 130,538" fill="none" stroke="#10b981" stroke-width="1.5"/>
  <text x="237" y="524" class="msg-green" text-anchor="middle">exit 0</text>

  <!-- CI 通过判定 -->
  <rect x="860" y="476" width="100" height="36" rx="6" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
  <text x="910" y="499" class="node-title" fill="#059669">CI 通过</text>

  <!-- 标题 -->
  <text x="40" y="36" class="title">CI 冒烟时序</text>
  <text x="40" y="54" font-size="10" fill="#64748b">契约 §7.1 · 启动到 basic.target ≤ 30s · 冒烟 ≤ 10s · 实测 7s</text>
</svg>