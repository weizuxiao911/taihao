<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 540">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
    .title { font-size: 16px; font-weight: 800; letter-spacing: 2px; fill: #0f172a; }
    .box-label { font-size: 12px; font-weight: 700; }
    .node-title { font-size: 11px; font-weight: 800; text-anchor: middle; fill: #0f172a; }
    .node-sub { font-size: 7.5px; font-weight: 400; text-anchor: middle; fill: #475569; }
  </style>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- ===== 可运行 OS 镜像(外层) ===== -->
  <rect x="40" y="90" width="620" height="430" rx="14" fill="none" stroke="#06b6d4" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="60" y="114" class="box-label" fill="#06b6d4">可运行 OS 镜像</text>

  <!-- ===== 内核 Image(左块,与 rootfs 同高,内部垂直水平居中) ===== -->
  <rect x="60" y="128" width="200" height="296" rx="8" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>

  <text x="160" y="177" class="node-title" fill="#6366f1">内核 Image</text>

  <text x="160" y="205" class="node-title">Linux 6.6 LTS · arm64</text>
  <text x="160" y="219" class="node-title">CONFIG_MODULES=n</text>
  <text x="160" y="233" class="node-title">48MB · ARM64 ELF</text>

  <line x1="78" y1="251" x2="242" y2="251" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="160" y="271" class="node-sub">运行环境</text>
  <text x="160" y="285" class="node-sub">cgroup v2 · namespaces</text>
  <text x="160" y="299" class="node-sub">virtio-net/blk · ext4</text>
  <text x="160" y="313" class="node-sub">SPI/I2C/GPIO/CAN · ttyAMA0</text>

  <line x1="78" y1="331" x2="242" y2="331" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="160" y="351" class="node-sub">配置来源</text>
  <text x="160" y="365" class="node-sub">qemu-aarch64-{ci,e2e}.config</text>
  <text x="160" y="379" class="node-sub">merge_config.sh · savedefconfig</text>

  <!-- ===== initramfs.cpio(rootfs)(右块) ===== -->
  <rect x="284" y="128" width="356" height="296" rx="8" fill="#ccfbf1" stroke="#14b8a6" stroke-width="2"/>
  <text x="462" y="150" class="node-title" fill="#14b8a6">initramfs.cpio(rootfs)</text>
  <text x="462" y="162" class="node-sub">141MB · cpio newc</text>

  <!-- 同层级节点:统一 292 × 42,间距 8 -->
  <!-- systemd(pid1) -->
  <rect x="316" y="170" width="292" height="42" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="462" y="187" class="node-title">systemd(pid 1)</text>
  <text x="462" y="200" class="node-sub">multi-user.target · journald</text>

  <!-- busybox + 系统库 -->
  <rect x="316" y="220" width="292" height="42" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="462" y="237" class="node-title">busybox + 系统库</text>
  <text x="462" y="250" class="node-sub">基础命令 · glibc · perl</text>

  <!-- 服务层 -->
  <rect x="316" y="270" width="292" height="42" rx="5" fill="#ffffff" stroke="#6366f1" stroke-width="2"/>
  <text x="462" y="284" class="node-title">服务(5× systemd unit)</text>
  <text x="462" y="296" class="node-sub">pi-agent · rt-loop · hal-gateway</text>
  <text x="462" y="307" class="node-sub">comm-center · extension-bridge</text>

  <!-- SKILL -->
  <rect x="316" y="320" width="292" height="42" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="462" y="337" class="node-title">SKILL.toml</text>
  <text x="462" y="350" class="node-sub">/usr/share/taihao-os/skills · ed25519</text>

  <!-- 运行时目录 -->
  <rect x="316" y="370" width="292" height="42" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="462" y="387" class="node-title">运行时目录</text>
  <text x="462" y="400" class="node-sub">/etc · /var/lib · /var/log taihao-os</text>

  <!-- ===== 启动方式(镜像盒内底部) ===== -->
  <rect x="60" y="446" width="580" height="42" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="350" y="470" class="node-title">qemu -kernel Image -initrd initramfs.cpio -append "console=ttyAMA0 rdinit=/sbin/init"</text>

  <text x="350" y="506" class="node-sub">验证:basic.target · 5 服务 active · savevm 重启 &lt; 2s</text>

  <!-- 标题 -->
  <text x="40" y="36" class="title">可运行镜像内部组成结构</text>
  <text x="40" y="54" font-size="10" fill="#64748b">镜像 = 内核 Image + initramfs rootfs(systemd / busybox / 5 服务 / SKILL / 运行时目录)</text>
</svg>
