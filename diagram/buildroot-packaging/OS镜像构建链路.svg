<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
    text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
    .title { font-size: 16px; font-weight: 800; letter-spacing: 2px; fill: #0f172a; }
    .node-title { font-size: 11px; font-weight: 800; text-anchor: middle; fill: #0f172a; }
    .node-sub { font-size: 9px; font-weight: 400; text-anchor: middle; fill: #475569; }
    .box-label { font-size: 9px; font-weight: 700; }
    .core-title { font-size: 12px; font-weight: 700; text-anchor: middle; }
    .core-line { font-size: 11px; font-weight: 400; text-anchor: middle; fill: #475569; }
  </style>
  <rect width="100%" height="100%" fill="#ffffff"/>

  <!-- 输入区边界 -->
  <rect x="40" y="90" width="240" height="330" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="52" y="108" class="box-label" fill="#94a3b8">输入</text>

  <!-- 输出区边界 -->
  <rect x="760" y="90" width="290" height="330" rx="12" fill="none" stroke="#60a5fa" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="772" y="108" class="box-label" fill="#60a5fa">产出</text>

  <!-- 连接箭头:输入 → 打包层 -->
  <line x1="260" y1="152" x2="378" y2="152" stroke="#94a3b8" stroke-width="2"/>
  <polyline points="372,144 380,152 372,160" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <line x1="260" y1="252" x2="378" y2="252" stroke="#94a3b8" stroke-width="2"/>
  <polyline points="372,244 380,252 372,260" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <line x1="260" y1="352" x2="378" y2="352" stroke="#94a3b8" stroke-width="2"/>
  <polyline points="372,344 380,352 372,360" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <!-- 连接箭头:打包层 → 输出 -->
  <line x1="690" y1="170" x2="778" y2="170" stroke="#f59e0b" stroke-width="2"/>
  <polyline points="772,162 780,170 772,178" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="732" y="162" class="core-title" fill="#f59e0b">打包</text>

  <!-- 连接箭头:OS 镜像 → A/B OTA -->
  <path d="M 900 284 L 900 222" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <!-- 连接箭头:构建 → A/B OTA(左缘中心) -->
  <line x1="690" y1="334" x2="778" y2="334" stroke="#f59e0b" stroke-width="2"/>
  <polyline points="772,326 780,334 772,342" fill="none" stroke="#f59e0b" stroke-width="2"/>
  <text x="734" y="324" class="core-title" fill="#f59e0b">打包(升级)</text>

  <polyline points="892,228 900,220 908,228" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <text x="908" y="258" class="core-title" fill="#3b82f6">升级</text>

  <!-- ===== 输入组件(Col 1) ===== -->
  <!-- 内核 Image -->
  <rect x="60" y="120" width="200" height="64" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="160" y="146" class="node-title">内核 Image</text>
  <text x="160" y="163" class="node-sub">Linux 6.6 LTS · arm64</text>
  <text x="160" y="177" class="node-sub">CONFIG_MODULES=n</text>

  <!-- 根文件系统 -->
  <rect x="60" y="220" width="200" height="64" rx="6" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2"/>
  <text x="160" y="246" class="node-title">根文件系统</text>
  <text x="160" y="263" class="node-sub">systemd 255 · busybox · ext4</text>

  <!-- 服务层 -->
  <rect x="60" y="320" width="200" height="64" rx="6" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="160" y="346" class="node-title">服务(5× systemd unit)</text>
  <text x="160" y="363" class="node-sub">pi-agent · rt-loop · hal-gateway</text>
  <text x="160" y="377" class="node-sub">comm-center · extension-bridge</text>

  <!-- ===== Buildroot 构建(Col 2) ===== -->
  <rect x="380" y="120" width="310" height="264" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
  <text x="535" y="148" class="node-title" fill="#f59e0b">Buildroot 构建</text>
  <text x="535" y="165" class="node-sub">BR2_EXTERNAL · 基座 OS 镜像</text>

  <g font-size="9.5" fill="#475569">
    <circle cx="405" cy="195" r="3" fill="#f59e0b"/>
    <text x="418" y="199">Config.in · taihao_defconfig(arm64)</text>
    <circle cx="405" cy="230" r="3" fill="#f59e0b"/>
    <text x="418" y="234">5× package recipe(cargo cross aarch64)</text>
    <circle cx="405" cy="265" r="3" fill="#f59e0b"/>
    <text x="418" y="269">overlays:systemd unit · SKILL.toml</text>
    <circle cx="405" cy="300" r="3" fill="#f59e0b"/>
    <text x="418" y="304">runtime 目录 /etc /usr/share /var/lib /var/log</text>
    <circle cx="405" cy="335" r="3" fill="#f59e0b"/>
    <text x="418" y="339">分区脚本 · A/B 槽位</text>
  </g>

  <text x="535" y="365" class="node-sub">编译 → 组装 → 产出镜像</text>

  <!-- ===== 产出(Col 3) ===== -->
  <!-- OS 镜像 -->
  <rect x="780" y="120" width="240" height="100" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="900" y="148" class="node-title">OS 镜像</text>
  <text x="900" y="166" class="node-sub">ext4 rootfs + Image + 引导</text>
  <text x="900" y="182" class="node-sub">QEMU 启动 · 5 服务 active</text>
  <text x="900" y="198" class="node-sub">重启 &lt; 2s(savevm)</text>

  <!-- A/B OTA -->
  <rect x="780" y="284" width="240" height="100" rx="6" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
  <text x="900" y="316" class="node-title">A/B OTA</text>
  <text x="900" y="334" class="node-sub">写非活动槽 → 校验 → 切换</text>
  <text x="900" y="350" class="node-sub">失败回滚 · dd 工厂烧录</text>

  <!-- 标题 -->
  <text x="40" y="36" class="title">OS 镜像构建链路</text>
  <text x="40" y="54" font-size="10" fill="#64748b">内核 Image + rootfs + 5 服务 → Buildroot 构建 → OS 镜像</text>

  <!-- 链路核心说明(无外框) -->
  <text x="540" y="468" class="core-title" fill="#f59e0b">链路核心</text>
  <text x="540" y="498" class="core-line">Linux 6.6 源码 + 裁剪片段 + aarch64 工具链 → merge_config → make Image(ccache) → initramfs 打包(5 服务) → QEMU 验证 · 重启 &lt; 2s</text>
</svg>
